<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Framework (pt-br)</title>
</head>
<body>
    <script>
        function redirect() {
            const startPath = "/pt-br/phoenix"
            
            if (!window.location.pathname.startsWith(startPath)) {
                window.location.href = window.location.origin + startPath
            }
        }
        redirect()
    </script>
</body>
</html>
